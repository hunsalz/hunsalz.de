name: Validate project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, types, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload validated site
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: dist
          if-no-files-found: error
          retention-days: 1
