version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      # Re-enable major TypeScript updates once Astro Check and TypeScript ESLint support them.
      ignore:
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
      groups:
          eslint:
              patterns:
                  [
                      "eslint",
                      "@eslint/*",
                      "@typescript-eslint/*",
                      "typescript-eslint",
                      "eslint-plugin-*",
                  ]
              update-types: ["minor", "patch"]
          formatting:
              patterns: ["prettier", "prettier-plugin-*"]
              update-types: ["minor", "patch"]
          fonts:
              patterns: ["@fontsource/*"]
              update-types: ["minor", "patch"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      rebase-strategy: "auto"
      groups:
          actions:
              patterns: ["*"]
              update-types: ["minor", "patch"]
